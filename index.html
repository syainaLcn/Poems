<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest of Words — Poem Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#2f3a17;--leaf:#5c6b2b;--cream:#f7f4e9;--paper:#fbf9ef;--ink:#2f3419;--muted:#7a7c58;--line:#dcdcc0;
  --night-border:#3a4020;--night-text:#ece8d4;--night-text-soft:#c6c7aa;--night-accent:#c9b87f;--night-accent-ink:#1a1c0a;--night-label:#cdbf8c;
  --grad-night:linear-gradient(135deg,#0c1107 0%,#1b200d 55%,#2c3016 100%);
  --grad-card:linear-gradient(150deg,#212b11 0%,#141b0b 100%);
  --grad-moss:linear-gradient(135deg,#2c3016 0%,#4a5a26 100%);
  --grad-gold:linear-gradient(135deg,#e6d9a6 0%,#c9b87f 55%,#aa976c 100%);
  --font-ui:'DM Sans',sans-serif;
  --font-serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--cream) 0%,#ecead2 100%) fixed;color:var(--ink);font:14px var(--font-ui)}
button,input,textarea{font-family:var(--font-ui)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--night-accent);outline-offset:2px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.23em;text-transform:uppercase;color:var(--night-label)}

.topbar{height:52px;display:flex;align-items:center;padding:0 20px;background:var(--grad-night);border-bottom:1px solid #363819;box-shadow:0 4px 15px #0005}
.topbar span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#efe9d0}

/* HERO: para ibalik ang forest image, idagdag sa dulo ng background: ,url("data:image/jpeg;base64,....") center/cover */
.hero{position:relative;overflow:hidden;padding:30px 20px 44px;color:#f4efdb;
  background:linear-gradient(90deg,#050902e0 0%,#0c110780 48%,#0c110718 100%),linear-gradient(0deg,#0c1107cc 0%,transparent 40%),var(--grad-moss)}
.hero-inner{max-width:1080px;margin:auto}
.brand{font-family:var(--font-serif);font-size:clamp(38px,9vw,64px);font-style:italic;font-weight:500;line-height:1;letter-spacing:-.02em;text-shadow:0 2px 22px #050902cc}
.brand::after{content:"";display:block;width:64px;height:2px;margin-top:16px;background:var(--grad-gold)}
.hero p{max-width:520px;margin:20px 0 0;font:italic 18px/1.65 var(--font-serif);color:#e6e3c8;text-shadow:0 1px 8px #050902cc}

main{flex:1;width:100%;max-width:760px;margin:28px auto 0;padding:0 14px 50px;position:relative}
.composer{padding:24px;background:var(--grad-card);border:1px solid #8a7a3e;border-radius:20px;box-shadow:0 18px 50px #0006,inset 0 0 0 1px #c9b87f1f;color:var(--night-text);
  background-image:radial-gradient(120% 80% at 100% 0%,#c9b87f26 0%,transparent 55%),var(--grad-card)}
.composer h2{margin:10px 0 20px;font:italic 600 clamp(28px,6vw,36px)/1.1 var(--font-serif);color:#f4ecc9}
.hint{margin:0 0 18px;font-size:12px;line-height:1.7;color:var(--night-text-soft)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;margin:0 0 6px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#b8ad7a}
input,textarea{width:100%;padding:12px 16px;border:1px solid #3d4422;border-radius:14px;background:linear-gradient(135deg,#1b200d,#101608);color:#f1ecd6;font-size:14px;outline:none}
input::placeholder,textarea::placeholder{color:#9a9b7e}
input:focus,textarea:focus{border-color:var(--night-accent);box-shadow:0 0 0 4px #c9b87f22}
textarea{min-height:230px;resize:vertical;font:italic 18px/1.7 var(--font-serif)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{padding:11px 20px;border:0;border-radius:24px;background:var(--grad-moss);color:#efe3b4;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer}
.btn{border:1px solid #6d7f38}
.btn:hover{filter:brightness(1.18)}
.link{padding:8px 4px;border:0;background:none;color:var(--night-label);font-size:11px;font-weight:600;cursor:pointer}
.link:hover{color:#fff;text-decoration:underline}
.meta{margin-left:auto;font-size:11px;color:#9a9b7e}

footer{padding:23px 14px;background:linear-gradient(180deg,#141b0b 0%,#050902 100%);font-size:10px;letter-spacing:.14em;text-align:center;color:#d9d3b4}

dialog#modal{width:min(94vw,920px,100vh);width:min(94vw,920px,100dvh);max-width:none;max-height:none;aspect-ratio:4/3;padding:0;overflow:visible;background:transparent;border:0;color:var(--night-text)}
dialog#modal[open]{display:block}
.card{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#141b0b;border:1px solid #8a7a3e;border-radius:20px;box-shadow:0 20px 65px #000a,inset 0 0 0 1px #c9b87f1f}
.savebar{position:absolute;right:0;bottom:calc(100% + 10px);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:100%}
.save{padding:9px 18px;border:1px solid #c9b87f;border-radius:24px;background:var(--grad-gold);color:var(--night-accent-ink);font-size:12px;font-weight:700;letter-spacing:.05em;cursor:pointer;box-shadow:0 4px 14px #0007}
.save:hover{filter:brightness(1.1)}
.save:disabled{opacity:.6;cursor:wait}
.vmenu{display:none;flex-wrap:wrap;gap:6px;justify-content:flex-end;width:100%}
.vmenu.show{display:flex}
.vopt{padding:7px 14px;border:1px solid #c9b87f;border-radius:20px;background:#141b0b;color:#f4ecc9;font-size:12px;font-weight:600;cursor:pointer}
.vopt:hover{background:#2c3016}
dialog#modal::backdrop{background:#050902cc;backdrop-filter:blur(2px)}
.modal-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:15px;height:52px;padding:0 10px 0 20px;background:var(--grad-night);border-bottom:1px solid #363819;box-shadow:0 4px 15px #0005}
.modal-head .eyebrow{font-size:10px;letter-spacing:.16em}
.modal-head h2{margin:0;font:600 18px var(--font-serif);letter-spacing:.08em;color:#efe9d0}
.close{flex-shrink:0;width:44px;height:44px;border:0;border-radius:0;background:transparent;color:#efe9d0;font-size:30px;line-height:1;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.close:hover{background:transparent;color:#b5803f}
.modal-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:20px 28px 22px;background:var(--grad-card);font-family:var(--font-serif);font-size:18px;line-height:1.7;color:#e9e4cb}
#mText{flex:1;min-height:0;overflow:auto;column-gap:2.4em}
.stanza{margin:0 0 1em;white-space:pre-line;overflow-wrap:anywhere;break-inside:avoid}
.stanza:last-of-type{margin-bottom:0}
.byline{flex:none;margin-top:.8em;font:italic clamp(12px,.75em,18px)/1.2 'Playfair Display',serif;text-align:right;color:var(--night-label)}

@media (max-width:640px){
  dialog#modal{width:min(94vw,76vh);width:min(94vw,76dvh);aspect-ratio:1/1}
  .modal-head{height:40px;padding:0 6px 0 16px}
  .modal-body{padding:12px 16px 14px}
  .byline{margin-top:.5em}
}
@media (max-width:480px){
  .hero p{font-size:16px}
  .row{grid-template-columns:1fr}
  .composer{padding:20px 18px}
  .card{border-radius:17px}
}
</style>
</head>
<body>
<nav class="topbar"><span>Poem Reader</span></nav>

<header class="hero"><div class="hero-inner">
  <div class="brand">Forest of Words</div>
</div></header>

<main>
  <section class="composer">
    <div class="eyebrow">A new page</div>
    <h2>Place your poem here.</h2>
    <div class="row">
      <div><label for="num">Poem number</label><input id="num" type="number" min="1" inputmode="numeric" placeholder="1"></div>
      <div><label for="author">Author</label><input id="author" value="Shaina"></div>
    </div>
    <label for="poem">Poem</label>
    <textarea id="poem"></textarea>
    <div class="actions">
      <button class="btn" id="read" type="button">Read</button>
      <button class="link" id="clear" type="button">Clear</button>
      <span class="meta" id="meta"></span>
    </div>
  </section>
</main>

<footer>FOREST OF WORDS · A POETRY COLLECTION</footer>

<dialog id="modal">
  <div class="savebar">
    <div class="vmenu" id="vmenu">
      <button class="vopt" data-s="10" type="button">10s</button>
      <button class="vopt" data-s="15" type="button">15s</button>
      <button class="vopt" data-s="20" type="button">20s</button>
      <button class="vopt" data-s="30" type="button">30s</button>
      <button class="vopt" data-s="45" type="button">45s</button>
      <button class="vopt" data-s="60" type="button">1 min</button>
    </div>
    <button class="save" id="saveVid" type="button">Save video</button>
    <button class="save" id="save" type="button">Save image</button>
  </div>
  <div class="card" id="card">
    <div class="modal-head" id="mHead">
      <div><h2 id="mTitle"></h2></div>
      <button class="close" id="close" type="button" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="mBody"><div id="mText"></div><div class="byline" id="mBy"></div></div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const modal = $('modal'), body = $('mBody');
const MIN = 9, MAX = 30;

function stanzas(text){
  return text.replace(/\r/g,'').trim().split(/\n\s*\n/).map((block) => {
    const p = document.createElement('p');
    p.className = 'stanza';
    p.textContent = block.split('\n').map((l) => l.trimEnd()).join('\n');
    return p;
  });
}

function fit(){
  if (!modal.open) return;
  const t = $('mText');
  const lh = (s) => s >= 20 ? 1.7 : s >= 14 ? 1.55 : 1.42;
  const set = (s) => { body.style.fontSize = s + 'px'; body.style.lineHeight = lh(s); };
  const fits = () => t.scrollHeight <= t.clientHeight + 1 && t.scrollWidth <= t.clientWidth + 1;
  const maxCols = t.clientWidth >= 800 ? 3 : t.clientWidth >= 560 ? 2 : 1;
  let best = null;
  for (let c = 1; c <= maxCols; c++){
    t.style.columnCount = c === 1 ? 'auto' : c;
    set(MIN);
    if (!fits()) continue;
    let lo = MIN, hi = MAX;
    while (hi - lo > 0.25){
      const mid = (lo + hi) / 2;
      set(mid);
      if (fits()) lo = mid; else hi = mid;
    }
    if (!best || lo > best.size * 1.12) best = { size: lo, cols: c };
  }
  if (!best) best = { size: 12, cols: 1 };
  t.style.columnCount = best.cols === 1 ? 'auto' : best.cols;
  set(best.size);
  t.scrollTop = 0;
}

function openPoem(){
  const text = $('poem').value;
  if (!text.trim()) { $('poem').focus(); return; }
  const author = $('author').value.trim() || 'Shaina';
  const n = parseInt($('num').value, 10);
  $('mTitle').textContent = n > 0 ? String(n).padStart(3, '0') : '';
  $('mTitle').hidden = !(n > 0);
  $('mBy').textContent = '— ' + author.toLowerCase();
  $('mText').replaceChildren(...stanzas(text));
  $('vmenu').classList.remove('show');
  if (!modal.open) modal.showModal();
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
}

function updateMeta(){
  const t = $('poem').value.trim();
  const lines = t ? t.split('\n').filter((l) => l.trim()).length : 0;
  const words = t ? t.split(/\s+/).length : 0;
  $('meta').textContent = lines ? lines + (lines === 1 ? ' line · ' : ' lines · ') + words + (words === 1 ? ' word' : ' words') : '';
}

$('read').onclick = openPoem;
$('clear').onclick = () => { $('poem').value = ''; $('num').value = ''; updateMeta(); $('poem').focus(); };
$('poem').addEventListener('input', updateMeta);
$('poem').addEventListener('paste', () => setTimeout(() => { updateMeta(); openPoem(); }, 250));

/* ---- Save: renders ONLY the overlay card (no Save/close buttons) ---- */
function cssGrad(ctx, x, y, w, h, deg, stops){
  const a = deg * Math.PI / 180, sx = Math.sin(a), sy = -Math.cos(a);
  const len = Math.abs(w * sx) + Math.abs(h * sy);
  const cx = x + w / 2, cy = y + h / 2;
  const g = ctx.createLinearGradient(cx - sx * len / 2, cy - sy * len / 2, cx + sx * len / 2, cy + sy * len / 2);
  stops.forEach(([p, c]) => g.addColorStop(p, c));
  return g;
}
function rr(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawText(ctx, el, ox, oy){
  const cs = getComputedStyle(el);
  ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  ctx.fillStyle = cs.color;
  ctx.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;
  ctx.textBaseline = 'middle';
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())){
    const str = node.nodeValue, r = document.createRange();
    let line = null;
    const flush = () => { if (line && line.t.trim()) ctx.fillText(line.t.replace(/\s+$/, ''), line.x - ox, line.y - oy); line = null; };
    for (let i = 0; i < str.length; i++){
      if (str[i] === '\n') { flush(); continue; }
      r.setStart(node, i); r.setEnd(node, i + 1);
      const b = r.getClientRects()[0];
      if (!b || (b.width === 0 && b.height === 0)) continue;
      const y = b.top + b.height / 2;
      if (line && Math.abs(y - line.y) > b.height / 2) flush();
      if (!line) line = { t: '', x: b.left, y };
      line.t += str[i];
    }
    flush();
  }
}
function buildCardCanvas(S){
  const MARGIN = 6;
  const card = $('card'), R = card.getBoundingClientRect();
  const W = R.width, H = R.height, rad = parseFloat(getComputedStyle(card).borderTopLeftRadius) || 20;
  const cv = document.createElement('canvas');
  cv.width = Math.round((W + MARGIN * 2) * S); cv.height = Math.round((H + MARGIN * 2) * S);
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  ctx.fillStyle = '#0c1107'; ctx.fillRect(0, 0, W + MARGIN * 2, H + MARGIN * 2);
  ctx.translate(MARGIN, MARGIN);
  ctx.save(); rr(ctx, 0, 0, W, H, rad); ctx.clip();
  const hr = $('mHead').getBoundingClientRect(), br = body.getBoundingClientRect();
  ctx.fillStyle = cssGrad(ctx, 0, br.top - R.top, W, br.height, 150, [[0, '#212b11'], [1, '#141b0b']]);
  ctx.fillRect(0, br.top - R.top, W, br.height);
  ctx.fillStyle = cssGrad(ctx, 0, 0, W, hr.height, 135, [[0, '#0c1107'], [.55, '#1b200d'], [1, '#2c3016']]);
  ctx.fillRect(0, 0, W, hr.height);
  ctx.fillStyle = '#363819'; ctx.fillRect(0, hr.height - 1, W, 1);
  if (!$('mTitle').hidden) drawText(ctx, $('mTitle'), R.left, R.top);
  drawText(ctx, $('mText'), R.left, R.top);
  drawText(ctx, $('mBy'), R.left, R.top);
  ctx.restore();
  ctx.strokeStyle = '#8a7a3e'; ctx.lineWidth = 1; rr(ctx, .5, .5, W - 1, H - 1, rad); ctx.stroke();
  return cv;
}
function fileName(extra, ext){
  const n = parseInt($('num').value, 10);
  return 'poem' + (n > 0 ? '-' + String(n).padStart(3, '0') : '') + extra + '.' + ext;
}
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function saveCard(){
  const btn = $('save'); btn.disabled = true;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const cv = buildCardCanvas(3);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    download(blob, fileName('', 'png'));
  } finally { btn.disabled = false; }
}

/* ---- Save video ---- */
async function saveVideo(sec){
  if (!window.MediaRecorder) { alert('Hindi supported ng browser na ito ang video recording.'); return; }
  const vb = $('saveVid'), label = vb.textContent;
  vb.disabled = true; $('save').disabled = true; $('vmenu').classList.remove('show');
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const src = buildCardCanvas(2);
    const W = src.width & ~1, H = src.height & ~1;
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const c = out.getContext('2d');
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mime = types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(out.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 6000000 } : undefined);
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise((res) => { rec.onstop = res; });
    const draw = (t) => {
      const fade = Math.max(0, Math.min(1, t / 0.9, (sec - t) / 0.9));
      const z = 0.97 + 0.03 * Math.min(1, t / sec);
      c.globalAlpha = 1; c.fillStyle = '#0c1107'; c.fillRect(0, 0, W, H);
      c.save(); c.globalAlpha = fade; c.translate(W / 2, H / 2); c.scale(z, z);
      c.drawImage(src, -W / 2, -H / 2, W, H); c.restore();
    };
    draw(0); rec.start();
    const t0 = performance.now();
    await new Promise((res) => {
      const tick = (now) => {
        const t = (now - t0) / 1000;
        if (t >= sec) { res(); return; }
        draw(t); vb.textContent = 'Recording… ' + Math.ceil(sec - t) + 's';
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    rec.stop(); await done;
    const ext = (rec.mimeType || mime).includes('mp4') ? 'mp4' : 'webm';
    download(new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' }), fileName('-' + sec + 's', ext));
  } finally { vb.textContent = label; vb.disabled = false; $('save').disabled = false; }
}

$('save').onclick = saveCard;
$('saveVid').onclick = () => $('vmenu').classList.toggle('show');
document.querySelectorAll('.vopt').forEach((b) => b.onclick = () => saveVideo(+b.dataset.s));
$('close').onclick = () => modal.close();
modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
window.addEventListener('resize', fit);
</script>
</body>
</html>
